[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mining-asset-pipeline"
version = "0.1.0"
description = "Prompt-and-RGB pipeline for generating physics-authored USD assets"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "Mining Asset Pipeline contributors"}]
keywords = ["isaac-sim", "robotics", "usd", "3d-generation", "mining"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
ui = ["gradio>=5.0,<7"]
llm = ["anthropic>=0.40"]
dev = ["build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
pattern = "test_*.py"
