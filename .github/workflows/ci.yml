name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Run unit tests
        run: python -m unittest discover -s tests/unit
      - name: Check command-line entry points
        run: |
          python scripts/run_pipeline.py --help >/dev/null
          python scripts/asset_tool.py --help >/dev/null
          python scripts/batch_pipeline.py --help >/dev/null
          python scripts/doctor.py --help >/dev/null
      - name: Check whitespace
        run: git diff --check
